[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-ml"
version = "1.0.0"
description = "Reactivity and rate-constant models for PRISM amide couplings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    # The saved model in model/ is a scikit-learn pickle and loads reliably
    # only under the minor version that wrote it.
    "scikit-learn>=1.9,<1.10",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    # The selected learner; the saved model in model/ needs it to load.
    "lightgbm>=4.7,<5",
]

[project.optional-dependencies]
# Descriptors for unseen molecules. xtb-python is also needed and is easiest from
# conda-forge: `conda install -c conda-forge xtb-python` (see environment.yml).
# Pinned to the versions the saved model's descriptors were computed with.
features = ["rdkit==2026.3.6", "morfeus-ml==0.8.0"]
# Further boosting libraries, used only by the learner benchmark.
boosting = ["xgboost>=2.0", "catboost>=1.2"]
# Graph-network families in the learner benchmark.
gnn = ["torch>=2.0"]
dev = ["pytest>=7.0"]
all = ["prism-ml[features,boosting,gnn,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
